name: SenseCAP Resource Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/sensecap_solar/**'
      - 'platformio.ini'
      - '.github/workflows/sensecap-resource-audit.yml'
      - '.github/actions/setup-build-environment/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sensecap-resource-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stock-repeater:
    name: Upstream stock SenseCAP Repeater
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream baseline
        uses: actions/checkout@v6
        with:
          ref: 75b04ef06def54b348400cb1b138afb6749ffd4f

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build stock Repeater
        shell: bash
        run: |
          set -o pipefail
          pio run -e SenseCap_Solar_repeater 2>&1 | tee stock-repeater-build.log

      - name: Report ELF sections and preserve build outputs
        shell: bash
        run: |
          set -euo pipefail
          SIZE_TOOL="$(find "$HOME/.platformio/packages" -type f -name arm-none-eabi-size -print -quit)"
          test -n "$SIZE_TOOL"
          ELF="$(find .pio/build/SenseCap_Solar_repeater -type f -name '*.elf' -print -quit)"
          test -n "$ELF"
          {
            echo "## Upstream stock SenseCAP Repeater"
            echo
            echo "Baseline commit: 75b04ef06def54b348400cb1b138afb6749ffd4f"
            echo
            echo "ELF section sizes:"
            echo
            "$SIZE_TOOL" -A "$ELF"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p audit-output
          cp stock-repeater-build.log audit-output/
          "$SIZE_TOOL" -A "$ELF" > audit-output/stock-repeater-sections.txt
          cp "$ELF" audit-output/
          find .pio/build/SenseCap_Solar_repeater -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.map' \) -exec cp {} audit-output/ \;

      - name: Upload stock Repeater audit
        uses: actions/upload-artifact@v4
        with:
          name: sensecap-stock-repeater-audit
          path: audit-output/

  fork-images:
    name: Fork Room-only and combined images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Room-only image
        shell: bash
        run: |
          set -o pipefail
          pio run -e SenseCap_Solar_room_server 2>&1 | tee room-server-build.log

      - name: Build combined Repeater + Room image
        shell: bash
        run: |
          set -o pipefail
          pio run -e SenseCap_Solar_repeater 2>&1 | tee combined-repeater-room-build.log

      - name: Report ELF sections and preserve build outputs
        shell: bash
        run: |
          set -euo pipefail
          SIZE_TOOL="$(find "$HOME/.platformio/packages" -type f -name arm-none-eabi-size -print -quit)"
          test -n "$SIZE_TOOL"
          mkdir -p audit-output
          {
            echo "## Fork SenseCAP firmware resource audit"
            echo
            echo "Source commit: ${{ github.event.pull_request.head.sha || github.sha }}"
            for ENV in SenseCap_Solar_room_server SenseCap_Solar_repeater; do
              ELF="$(find ".pio/build/$ENV" -type f -name '*.elf' -print -quit)"
              test -n "$ELF"
              echo
              echo "### $ENV"
              echo "ELF section sizes:"
              "$SIZE_TOOL" -A "$ELF"
              "$SIZE_TOOL" -A "$ELF" > "audit-output/$ENV-sections.txt"
              cp "$ELF" "audit-output/$ENV.elf"
              find ".pio/build/$ENV" -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.map' \) -exec cp {} audit-output/ \;
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cp room-server-build.log combined-repeater-room-build.log audit-output/

      - name: Upload fork firmware audit
        uses: actions/upload-artifact@v4
        with:
          name: sensecap-fork-firmware-audit
          path: audit-output/
