name: PR Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run the complete cross-platform build matrix'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix) || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review')) && fromJSON('["Heltec_v3_companion_radio_ble","Heltec_v3_repeater","Heltec_v3_room_server","RAK_4631_companion_radio_ble","RAK_4631_companion_radio_ethernet","RAK_4631_repeater","RAK_4631_repeater_ethernet","RAK_4631_room_server","RAK_4631_room_server_ethernet","SenseCap_Solar_repeater","PicoW_repeater","wio-e5-mini_repeater","LilyGo_Tlora_C6_repeater_","wio_wm1110_repeater","Tbeam_SX1276_repeater"]') || fromJSON('["SenseCap_Solar_repeater"]') }}

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}